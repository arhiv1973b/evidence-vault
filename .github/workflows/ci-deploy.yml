name: CI and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests (if any)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then
            python -m pip install pytest
            pytest -q || true
          else
            echo "No tests found, skipping"
          fi

      - name: Optional model-test (explicit opt-in)
        if: env.ANTIGRAVITY_MODEL_TEST_ENABLED == 'true'
        env:
          ANTIGRAVITY_MODELS: ${{ secrets.ANTIGRAVITY_MODELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "Running opt-in model test (minimal payload)"
          python -m google.antigravity.cli model-test --prompt "CI model test"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e .

      - name: Build site
        env:
          ANTIGRAVITY_SITE_BUILD_CMD: ${{ secrets.ANTIGRAVITY_SITE_BUILD_CMD }}
        run: |
          BUILD_CMD="${{ secrets.ANTIGRAVITY_SITE_BUILD_CMD }}"
          if [ -z "$BUILD_CMD" ]; then
            echo "No build command configured; skipping site build"
          else
            echo "Running build: $BUILD_CMD"
            eval "$BUILD_CMD"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          publish_dir: ./public
